# Docker Compose do app Vivo Gestão de Linhas (app + scraper apenas).
# O Supabase já está rodando em /home/user/vivo-supabase/ (porta 9000).

services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: https://consumo-ytech.yrwentechnology.com.br/api
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: vivo-web
    restart: unless-stopped
    environment:
      # SSR fala com o Supabase pela rede interna do Docker (rede do supabase).
      SUPABASE_URL: http://vivo-supabase-kong:8000
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # URL pública que o navegador do cliente usa (via nginx → 9000).
      VITE_SUPABASE_URL: https://consumo-ytech.yrwentechnology.com.br/api
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3008
    ports:
      - "127.0.0.1:3008:3008"
    networks:
      - default
      - vivo-supabase

  scraper:
    build: ./scraper
    container_name: vivo-scraper
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://vivo-supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VIVO_PORTAL_USER: ${VIVO_PORTAL_USER:-}
      VIVO_PORTAL_PASS: ${VIVO_PORTAL_PASS:-}
      VIVO_PORTAL_URL: ${VIVO_PORTAL_URL:-https://login.vivo.com.br/login}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@yrwentechnology.com.br}
      SCRAPER_INTERVAL_SEC: ${SCRAPER_INTERVAL_SEC:-300}
    volumes:
      - scraper-storage:/data
    networks:
      - default
      - vivo-supabase

networks:
  vivo-supabase:
    name: vivo-supabase_default
    external: true

volumes:
  scraper-storage:
